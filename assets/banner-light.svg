<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f2edff"/><stop offset="100%" stop-color="#e8f6fb"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#06B6D4"/>
  </linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.6" fill="#8B5CF6" opacity=".13"/>
  </pattern>
  <clipPath id="round"><rect width="1000" height="280" rx="14"/></clipPath>
</defs>

<g clip-path="url(#round)">
  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#dots)"/>
  <rect x="0" y="0" width="7" height="280" fill="url(#bar)"/>

  <text x="64" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="54" font-weight="800"
        fill="#161b22" letter-spacing="-1.5">Joy Mridha</text>
  <text x="66" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" fill="#0891b2">building things that run while I sleep</text>
  <text x="66" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#59636e" letter-spacing=".6">Go &#183; Python &#183; TypeScript &#183; agentic AI</text>

  <g transform="translate(676,62)">
    <rect width="268" height="156" rx="10" fill="#ffffff" stroke="#d8dee6"/>
    <rect width="268" height="30" rx="10" fill="#d8dee6" opacity=".5"/>
    <rect y="20" width="268" height="10" fill="#d8dee6" opacity=".5"/>
    <circle cx="18" cy="15" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="15" r="5" fill="#febc2e"/>
    <circle cx="54" cy="15" r="5" fill="#28c840"/>
    <text x="20" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#0f766e">$ ./joy --ship</text>
    <text x="20" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#59636e">building...</text>
    <text x="20" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#8250df">ok. sleeping now</text>
    <text x="20" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#0f766e">$ </text>
    <rect x="34" y="124" width="8" height="14" fill="#0891b2">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</g>
</svg>